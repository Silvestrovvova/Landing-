<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new_telefon</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="main-header__logo">LEGO DEV</div>
      <div class="main-header__nav-wrapper">
        <div class="main-header__status">
          Projects: <span class="main-header__count">2</span>
        </div>

        <nav class="main-header__nav">
          <ul class="main-header__list">
            <li class="main-header__item main-header__item--active">Home</li>
            <li class="main-header__item">
              <a href="gallery.html" class="nav__link">Gallery</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="card-grid">
      <article class="product-card">
        <div class="product-card__image-wrapper">
          <img
            src="img/foto5.webp"
            alt="Lego Model"
            class="product-card__image"
          />
        </div>

        <div class="product-card__content">
          <h3 class="product-card__title">Lego House</h3>
          <p class="product-card__text">
            Архетектурная модуль из базовго набора.
          </p>

          <div class="product-card__info">1240 деталей</div>

          <button class="product-card__button">Подробнее</button>
        </div>
      </article>

      <article class="product-card product-card--featured">
        <div class="product-card__image-wrapper">
          <img
            src="img/foto10.webp"
            alt="Lego Building"
            class="product-card__image"
          />
        </div>

        <div class="product-card__content">
          <h3 class="product-card__title">Премиум план</h3>
          <p class="product-card__text">Все возможности без ограничений.</p>
          <div class="product-card__info">1120 деталей</div>

          <button class="product-card__button product-card--highlight">
            Купить сейчас
          </button>
        </div>
      </article>
    </div>

    <footer class="main-footer">
      <div class="main-footer__content">
        <div class="main-footer__info">
          <p class="main-footer__copyright">
            &copy; 2026 Lego Architecture Portfolio
          </p>
          <p class="main-footer__location">Europe | Android Dev Mode</p>
        </div>

        <div class="main-footer__links">
          <a href="https://wa.me/380930800145" target="_blank" title="WhatsApp"
            >WhatsApp</a
          >
          <a
            href="https://www.facebook.com/profile.php?id=100021775414698"
            target="_blank"
            title="Facebook"
            >Facebook</a
          >
        </div>
      </div>
    </footer>
  </body>
</html>
