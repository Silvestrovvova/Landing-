<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaufland App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__logo">Kaufland</h1>
      <input
        type="text"
        id="searchInput"
        oninput="searchProducts()"
        placeholder="Поиск товаров ..."
        class="header__search"
      />

      <div class="category-filters">
        <button onclick="filterByCategory('all')">Vše</button>
        <button onclick="filterByCategory('zelenina')">Zelenina</button>
        <button onclick="filterByCategory('Maso')">Maso</button>
        <button onclick="filterByCategory('Mléčné výrobky')">Mléčné</button>
        <button onclick="filterByCategory('18+')">18+</button>
      </div>

      <div class="header__card" onclick="toggleCart()" style="cursor: pointer">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </div>
    </header>

    <div class="shop-location">
      <h2>Kaufland Litvinov</h2>
      <p>Jiraskova 2181, 436 01 Litvinov 1</p>
      <p>Otevreno dnes: до 22:00</p>
    </div>

    <div id="cart-modal" class="cart-modal">
      <div class="cart-modal__content">
        <div class="cart-modal__header">
          <h2>Ваша корзина</h2>
          <button onclick="toggleCart()" class="cart-modal__close">
            &times;
          </button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-modal__footer">
          <h3>Итого: <span id="cart-total">0</span>Kč</h3>
          <button onclick="checkout()" class="cart__button">
            Оформить заказ
          </button>
          <button onclick="clearCart()" class="clear-btn">Vymazat vse</button>
        </div>
      </div>
    </div>

    <main class="container">
      <div id="product-grid" class="shop-grid"></div>
    </main>

    <section class="notepad-section">
      <h2>Můj nákupni seznam(блокнот заметок)</h2>

      <div class="notepad-input-group">
        <input type="text" id="noteInput" placeholder="Napište, co koupit..." />
        <button onclick="addNote()">Přidat(добавить)</button>
      </div>
      <ul id="note-list" class="notepad-list"></ul>
    </section>

    <script src="script.js"></script>
  </body>
</html>
