<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaufland App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <h1 class="header__logo">Kaufland</h1>

        <input
          type="text"
          id="searchInput"
          oninput="searchProducts()"
          placeholder="Поиск товаров ..."
          class="header__search"
        />
        <button class="header__cart-btn" onclick="toggleCart()">
          <span>Корзина</span>
          <span id="cart-count" class="header__cart-count">0</span>
        </button>
      </div>
    </header>

    <div class="shop-location">
      <h2>Kaufland Litvinov</h2>
      <p>Jiraskova 2181, 436 01 Litvinov 1</p>
      <p>Otevreno dnes: до 22:00</p>
    </div>

    <main class="main-content container">
      <section class="categories">
        <button
          class="categories__btn categories__btn--active"
          onclick="filterByCategory('all')"
        >
          Vše
        </button>
        <button class="categories__btn" onclick="filterByCategory('zelenina')">
          Zelenina
        </button>
        <button class="categories__btn" onclick="filterByCategory('Maso')">
          Maso
        </button>
        <button
          class="categories__btn"
          onclick="filterByCategory('Mléčné výrobky')"
        >
          Mléčné
        </button>
        <button class="categories__btn" onclick="filterByCategory('18+')">
          18+
        </button>
      </section>
      <div id="product-grid" class="shop-grid"></div>
    </main>

    <div id="cart-modal" class="cart-modal">
      <div class="cart-modal__content">
        <div class="cart-modal__header">
          <h2>Ваша корзина</h2>
          <button onclick="toggleCart()" class="cart-modal__close">
            &times;
          </button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-modal__footer">
          <h3>Итого: <span id="cart-total">0</span>Kč</h3>
          <button onclick="checkout()" class="cart__button">
            Оформить заказ
          </button>
          <button onclick="clearCart()" class="clear-btn">Vymazat vse</button>
        </div>
      </div>
    </div>

    <main class="container">
      <div id="product-grid" class="shop-grid"></div>
    </main>

    <section class="notepad-section">
      <h2>Můj nákupni seznam(блокнот заметок)</h2>

      <div class="notepad-input-group">
        <input type="text" id="noteInput" placeholder="Napište, co koupit..." />
        <button onclick="addNote()">Přidat(добавить)</button>
      </div>
      <ul id="note-list" class="notepad-list"></ul>
    </section>

    <section class="history-section">
      <h2>Historie výdajú (История расходов)</h2>

      <div class="history-summary">
        <p>
          Celcem utraceno (Всего потрачено):
          <strong id="history-total">0 Kč</strong>
        </p>
      </div>

      <ul id="history-list" class="history-list"></ul>

      <button class="history-clear-btn" onclick="clearHistory()">
        Vymazat historii (Очистить историю)
      </button>
    </section>

    <div id="receipt-modal" class="receipt-modal" style="display: none">
      <div class="receipt-modal__content">
        <div class="receipt-modal__header">
          <h2><i class="fa-solid fa-receipt"></i>Vaše účtenka(Ваш чек)</h2>
          <button class="receipt-modal__close"></button>
        </div>

        <div id="receipt-body" class="receipt-moal__body"></div>

        <div class="receipt-modal__footer">
          <button
            class="receipt-modal__btn receipt-modal__btn--copy"
            onclick="copyReceiptToClipboard()"
          >
            <i class="fa-solid fa-copy"></i>Kopírovat (копировать текс)
          </button>
          <button
            class="receipt-modal__btn receipt-modal__btn--close"
            onclick="closeReceipt()"
          >
            <i class="fa-solid fa-check"></i> Zavřít (Закрыть)
          </button>
        </div>
      </div>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
  </body>
</html>
