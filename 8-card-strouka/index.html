<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construction Album</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body class="page">
    <main class="page__content">
      <section class="album-list">
        <div class="preview" data-album="construction">
          <h2 class="preview__title">Стройка</h2>
          <div class="preview__card">
            <img src="img/str_1.jpg" alt="Стройка" class="preview__img" />
            <div class="preview__overlay">
              <span class="preview__text">Стройка</span>
            </div>
          </div>
        </div>

        <div class="preview" data-album="me">
          <h2 class="preview__title">Я на обьекте</h2>
          <div class="preview__card">
            <img src="img/ja_1.jpg" alt="Я" class="preview__img" />
            <div class="preview__overlay">
              <span class="preview__text">Я на обьекте</span>
            </div>
          </div>
        </div>

        <div class="preview" data-album="dom">
          <h2 class="preview__title">Вид дома</h2>
          <div class="preview__card">
            <img src="img/vid_doma_1.jpg" alt="Дом" class="preview__img" />
            <div class="preview__overlay">
              <span class="preview__text">Вид дома</span>
            </div>
          </div>
        </div>

        <div class="preview" data-album="plotnya">
          <h2 class="preview__title">Плотня и бетон</h2>
          <div class="preview__card">
            <img src="img/ja_6.jpg" alt="plotnya" class="preview__img" />
            <div class="preview__overlay">
              <span class="preview__text">Плотня и бетон</span>
            </div>
          </div>
        </div>

        <div class="preview" data-album="vid_s_doma">
          <h2 class="preview__title">Виды с дома</h2>
          <div class="preview__card">
            <img src="img/vid_1.jpg" alt="Дом" class="preview__img" />
            <div class="preview__overlay">
              <span class="preview__text">Виды с дома</span>
            </div>
          </div>
        </div>
      </section>

      <div class="modal" id="modalContainer">
        <div class="modal__top">
          <button class="modal__back" id="closeBtn">Назад</button>
          <h3 class="modal__heading" id="modalTitle">Галерея</h3>
        </div>

        <div class="modal__content">
          <div id="construction" class="album-grid">
            <img src="img/str_1.jpg" class="album-grid__photo" />
            <img src="img/str_2.jpg" class="album-grid__photo" />
            <img src="img/str_3.jpg" class="album-grid__photo" />
            <img src="img/str_4.jpg" class="album-grid__photo" />
            <img src="img/str_5.jpg" class="album-grid__photo" />
            <img src="img/dom_1.jpg" class="album-grid__photo" />
            <img src="img/dom_2.jpg" class="album-grid__photo" />
            <img src="img/dom_3.jpg" class="album-grid__photo" />
            <img src="img/dom_4.jpg" class="album-grid__photo" />
            <img src="img/dom_5.jpg" class="album-grid__photo" />
          </div>

          <div id="me" class="album-grid">
            <img src="img/ja_1.jpg" class="album-grid__photo" />
            <img src="img/ja_2.jpg" class="album-grid__photo" />
            <img src="img/ja_3.jpg" class="album-grid__photo" />
            <img src="img/ja_4.jpg" class="album-grid__photo" />
            <img src="img/ja_5.jpg" class="album-grid__photo" />
            <img src="img/ja_6.jpg" class="album-grid__photo" />
            <img src="img/ja_7.jpg" class="album-grid__photo" />
          </div>

          <div id="dom" class="album-grid">
            <img src="img/vid_doma_1.jpg" class="album-grid__photo" />
            <img src="img/vid_doma_2.jpg" class="album-grid__photo" />
            <img src="img/vid_doma_3.jpg" class="album-grid__photo" />
            <img src="img/vid_doma_4.jpg" class="album-grid__photo" />
            <img src="img/dom_1.jpg" class="album-grid__photo" />
            <img src="img/dom_2.jpg" class="album-grid__photo" />
            <img src="img/dom_3.jpg" class="album-grid__photo" />
            <img src="img/dom_4.jpg" class="album-grid__photo" />
            <img src="img/dom_5.jpg" class="album-grid__photo" />
          </div>

          <div id="plotnya" class="album-grid">
            <img src="img/plotnya_1.jpg" class="album-grid__photo" />
            <img src="img/plotnya_2.jpg" class="album-grid__photo" />
            <img src="img/plotnya_3.jpg" class="album-grid__photo" />
            <img src="img/plotnya_4.jpg" class="album-grid__photo" />
            <img src="img/plotnya_5.jpg" class="album-grid__photo" />
            <img src="img/beton_1.jpg" class="album-grid__photo" />
            <img src="img/beton_2.jpg" class="album-grid__photo" />
            <img src="img/beton_3.jpg" class="album-grid__photo" />
            <img src="img/beton_4.jpg" class="album-grid__photo" />
            <img src="img/beton_5.jpg" class="album-grid__photo" />
            <img src="img/beton_6.jpg" class="album-grid__photo" />
            <img src="img/beton_7.jpg" class="album-grid__photo" />
          </div>

          <div id="vid_s_doma" class="album-grid">
            <img src="img/vid_1.jpg" class="album-grid__photo" />
            <img src="img/vid_2.jpg" class="album-grid__photo" />
            <img src="img/vid_3.jpg" class="album-grid__photo" />
            <img src="img/vid_4.jpg" class="album-grid__photo" />
            <img src="img/vid_5.jpg" class="album-grid__photo" />
            <img src="img/vid_6.jpg" class="album-grid__photo" />
            <img src="img/vid_7.jpg" class="album-grid__photo" />
            <img src="img/vid_8.jpg" class="album-grid__photo" />
            <img src="img/vid_9.jpg" class="album-grid__photo" />
            <img src="img/vid_10.jpg" class="album-grid__photo" />
            <img src="img/vid_11.jpg" class="album-grid__photo" />
            <img src="img/vid_12.jpg" class="album-grid__photo" />
            <img src="img/vid_13.jpg" class="album-grid__photo" />
            <img src="img/vid_14.jpg" class="album-grid__photo" />
          </div>
        </div>
      </div>

      <div class="lightbox" id="lightbox">
        <button class="lightbox__close" id="lightboxClose">&times;</button>
        <img src="" alt="" class="lightbox__image" id="lightboxImg" />
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
